components:
    schemas:
        Paciente:
            type: object
            required:
                - nome
                - sobrenome
                - cpf
            properties:
                id_paciente:
                    type: integer
                    example: 1
                id_usuario:
                    type: integer
                    nullable: true
                    example: 42
                nome:
                    type: string
                    example: 'Carlos'
                sobrenome:
                    type: string
                    example: 'Almeida'
                cpf:
                    type: string
                    example: '12345678901'
                data_nascimento:
                    type: string
                    format: date
                    example: '1985-08-22'
                numero_contato:
                    type: string
                    example: '62988887777'
