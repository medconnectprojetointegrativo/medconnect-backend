paths:
    /pacientes/{id_paciente}/documentos:
        post:
            summary: Registra um documento para o paciente
            tags: [Documentações de Paciente]
            parameters:
                - in: path
                  name: id_paciente
                  required: true
                  schema:
                      type: integer
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/PacienteDocumentos'
            responses:
                201:
                    description: Documento criado com sucesso

    /pacientes/documentos/{id_documento_paciente}:
        put:
            summary: Atualiza um documento específico
            tags: [Documentações de Paciente]
            parameters:
                - in: path
                  name: id_documento_paciente
                  required: true
                  schema:
                      type: integer
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/PacienteDocumentos'
            responses:
                201:
                    description: Documento atualizado com sucesso
        delete:
            summary: Exclui um documento específico
            tags: [Documentações de Paciente]
            parameters:
                - in: path
                  name: id_documento_paciente
                  required: true
                  schema:
                      type: integer
            responses:
                200:
                    description: Documento excluído com sucesso
